name: update stats cards

on:
  schedule:
    - cron: "30 */6 * * *"   # every 6 hours
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: [".github/**"]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build cards
        env:
          # Your personal token (repo + read:user scopes), saved as the
          # GH_STATS_TOKEN repo secret. It lets the cards count private repos.
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::GH_STATS_TOKEN secret is missing - cards not updated. See README setup."
            exit 0
          fi
          python .github/scripts/make_cards.py
      - name: commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add assets/streak.svg assets/langs.svg
          git diff --cached --quiet || (git commit -m "📊 Refresh stats" && git push)
